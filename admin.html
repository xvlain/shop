<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二游情报铺 · 管理后台</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
<meta name="robots" content="noindex, nofollow">
<style>
:root {
  --bg: #fff5f8; --panel: #ffffff; --ink: #2d2a32; --ink-dim: #8a7f8e;
  --ink-faint: #c4b8c8; --line: #f0dce4; --accent: #e87aa0; --accent-deep: #d4567e;
  --accent-soft: #f5c6d8; --accent-pale: #fdf0f5;
  --danger: #e05555; --success: #50b878; --warning: #e8a040;
  --font: 'LXGW WenKai', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --radius: 14px; --shadow: 0 2px 12px rgba(232,122,160,.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { font-size:15px; }
body { font-family:var(--font); background:var(--bg); color:var(--ink); min-height:100vh; padding-bottom:68px; }

/* login gate */
#gate { position:fixed; inset:0; z-index:999; background:var(--bg); display:flex; align-items:center; justify-content:center; }
#gate.hidden { display:none; }
.gate-box { background:var(--panel); border:1.5px solid var(--line); border-radius:var(--radius); padding:40px 36px; max-width:360px; width:90%; text-align:center; box-shadow:var(--shadow); }
.gate-box h2 { font-size:20px; margin-bottom:6px; color:var(--accent-deep); }
.gate-box p { font-size:13px; color:var(--ink-dim); margin-bottom:24px; }
.gate-input { width:100%; padding:12px 16px; border:1.5px solid var(--line); border-radius:10px; font-size:15px; font-family:var(--font); outline:none; text-align:center; letter-spacing:2px; }
.gate-input:focus { border-color:var(--accent); }
.gate-btn { width:100%; margin-top:16px; padding:12px; background:var(--accent); color:#fff; border:none; border-radius:10px; font-size:15px; font-weight:700; font-family:var(--font); cursor:pointer; }
.gate-btn:hover { background:var(--accent-deep); }
.gate-err { color:var(--danger); font-size:13px; margin-top:12px; display:none; }
.gate-err.show { display:block; }

/* top bar */
.topbar { background:var(--panel); border-bottom:1.5px solid var(--line); padding:14px 20px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:50; }
.hamburger { background:none; border:none; cursor:pointer; padding:4px; color:var(--ink); display:flex; align-items:center; }
.hamburger svg { width:24px; height:24px; }
.topbar h1 { font-size:16px; color:var(--accent-deep); flex:1; }
.topbar .sub { font-size:11px; color:var(--ink-faint); }

/* sidebar overlay */
.sidebar-overlay { position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:100; opacity:0; pointer-events:none; transition:opacity .25s; }
.sidebar-overlay.open { opacity:1; pointer-events:auto; }
.sidebar { position:fixed; top:0; left:-280px; width:280px; height:100%; background:var(--panel); z-index:101; transition:left .3s cubic-bezier(.4,0,.2,1); padding:24px 20px; box-shadow:4px 0 20px rgba(0,0,0,.1); }
.sidebar.open { left:0; }
.sidebar h3 { font-size:14px; color:var(--ink-faint); margin-bottom:16px; letter-spacing:.1em; }
.sidebar-item { display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:12px; cursor:pointer; font-size:15px; font-weight:600; color:var(--ink); transition:all .15s; margin-bottom:4px; }
.sidebar-item:hover { background:var(--accent-pale); color:var(--accent-deep); }
.sidebar-item.active { background:var(--accent-pale); color:var(--accent-deep); }
.sidebar-item svg { width:20px; height:20px; flex-shrink:0; }
.sidebar-close { position:absolute; top:16px; right:16px; background:none; border:none; cursor:pointer; color:var(--ink-dim); font-size:20px; }

/* stats bar */
.stats-bar { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; padding:14px 20px; }
.stat-card { background:var(--panel); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; text-align:center; }
.stat-card .num { font-size:22px; font-weight:700; color:var(--accent-deep); }
.stat-card .label { font-size:11px; color:var(--ink-dim); margin-top:2px; }

/* tabs */
.tabs { display:flex; gap:0; padding:0 20px; border-bottom:1.5px solid var(--line); overflow-x:auto; }
.tab { padding:10px 16px; font-size:13px; font-weight:700; color:var(--ink-dim); cursor:pointer; border:none; background:none; font-family:var(--font); border-bottom:2.5px solid transparent; white-space:nowrap; }
.tab:hover { color:var(--accent); }
.tab.active { color:var(--accent-deep); border-bottom-color:var(--accent); }

/* content */
.content { padding:16px 20px; }
.panel { display:none; }
.panel.active { display:block; }

/* code grid & chips */
.code-toolbar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
.btn-sm { padding:7px 14px; border-radius:8px; border:1.5px solid var(--accent-soft); background:var(--accent-pale); color:var(--accent-deep); font-size:12px; font-weight:700; font-family:var(--font); cursor:pointer; }
.btn-sm:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn-sm.success { border-color:#b8e8c8; background:#f0faf4; color:var(--success); }
.btn-sm.success:hover { background:var(--success); color:#fff; }
.btn-sm.danger { border-color:#f5c0c0; background:#fff5f5; color:var(--danger); }
.btn-sm.danger:hover { background:var(--danger); color:#fff; }
.btn-sm.warning { border-color:#f0d8a0; background:#fffbe8; color:var(--warning); }
.code-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(115px,1fr)); gap:7px; }
.code-chip { background:var(--panel); border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; font-family:Consolas,monospace; font-size:12.5px; font-weight:600; cursor:pointer; text-align:center; user-select:all; }
.code-chip:hover { border-color:var(--accent); background:var(--accent-pale); }

/* tables */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { background:var(--accent-pale); color:var(--accent-deep); font-weight:700; padding:9px 11px; text-align:left; border-bottom:1.5px solid var(--line); font-size:12px; }
td { padding:9px 11px; border-bottom:1px solid var(--line); }
tr:hover td { background:var(--accent-pale); }
td.mono { font-family:Consolas,monospace; font-weight:600; }
td.dim { color:var(--ink-dim); font-size:12px; }

/* generate form */
.gen-form { background:var(--panel); border:1.5px solid var(--line); border-radius:var(--radius); padding:20px; max-width:400px; margin-bottom:20px; }
.gen-form label { display:block; font-size:12px; color:var(--ink-dim); font-weight:700; margin-bottom:4px; }
.gen-form input[type="number"], .gen-form input[type="text"], .gen-form select, .gen-form textarea {
  width:100%; padding:10px 14px; border:1.5px solid var(--line); border-radius:8px; font-size:14px; font-family:var(--font); outline:none; margin-bottom:12px;
}
.gen-form input:focus, .gen-form select:focus, .gen-form textarea:focus { border-color:var(--accent); }
.gen-result { margin-top:14px; padding:12px; border-radius:10px; background:var(--accent-pale); border:1.5px solid var(--accent-soft); font-size:13px; display:none; max-height:300px; overflow-y:auto; }
.gen-result.show { display:block; }

/* bottom nav */
#bnav { position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1.5px solid var(--line); z-index:50; padding-bottom:env(safe-area-inset-bottom); }
#bnav .bnav-inner { display:flex; max-width:520px; margin:0 auto; }
#bnav .bnav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 0 8px; border:none; background:none; color:var(--ink-faint); cursor:pointer; font-family:var(--font); }
#bnav .bnav-item.active { color:var(--accent); }
#bnav .bnav-item svg { width:22px; height:22px; }
#bnav .bnav-label { font-size:11px; font-weight:600; }

/* ===== ORDER STYLES ===== */
.order-card { background:var(--panel); border:1.5px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; cursor:pointer; transition:all .15s; }
.order-card:hover { border-color:var(--accent); box-shadow:var(--shadow); }
.order-card.expanded { cursor:default; }
.order-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.order-id { font-weight:700; color:var(--accent-deep); font-size:15px; }
.order-device { font-family:Consolas,monospace; font-size:12px; color:var(--ink-dim); background:var(--accent-pale); padding:2px 8px; border-radius:6px; }
.order-meta { display:flex; gap:12px; margin-top:8px; font-size:12px; color:var(--ink-dim); flex-wrap:wrap; }
.order-status { font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; }
.order-status.pending { background:#fff3e0; color:#e68a00; }
.order-status.completed { background:#e8f5e9; color:#2e7d32; }
.order-total { font-size:18px; font-weight:700; color:var(--accent-deep); }
.order-body { margin-top:14px; display:none; border-top:1.5px solid var(--line); padding-top:14px; }
.order-card.expanded .order-body { display:block; }
.order-card.expanded { cursor:default; }
.order-items-table { width:100%; margin-bottom:12px; }
.order-items-table td { padding:6px 0; font-size:13px; border:none; }
.order-items-table .oi-name { font-weight:600; }
.order-items-table .oi-price { text-align:right; color:var(--accent-deep); font-weight:700; }
.order-items-table .oi-free { color:var(--success); font-style:italic; }
.order-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.order-edit-row { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
.order-edit-row label { font-size:12px; color:var(--ink-dim); font-weight:600; white-space:nowrap; }
.order-edit-row select, .order-edit-row input { padding:6px 10px; border:1.5px solid var(--line); border-radius:8px; font-size:13px; font-family:var(--font); }
.code-assign-row { display:flex; gap:6px; align-items:center; margin-top:6px; }
.code-assign-row select { flex:1; padding:6px 8px; border:1.5px solid var(--line); border-radius:8px; font-size:12px; font-family:var(--font); }

/* group cards */
.group-card { background:var(--panel); border:1.5px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; }
.group-head { display:flex; align-items:center; justify-content:space-between; }
.group-name { font-size:16px; font-weight:700; color:var(--accent-deep); }
.group-stats { font-size:12px; color:var(--ink-dim); margin-top:4px; }
.group-orders { margin-top:12px; border-top:1px solid var(--line); padding-top:10px; }
.group-order-mini { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
.group-order-mini:last-child { border-bottom:none; }

/* loading & toast */
.loading { text-align:center; padding:30px; color:var(--ink-faint); }
.loading .spinner { width:22px; height:22px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .6s linear infinite; margin:0 auto 8px; }
@keyframes spin { to { transform:rotate(360deg); } }
.toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 22px; border-radius:999px; font-size:13px; z-index:999; opacity:0; transition:opacity .3s; pointer-events:none; }
.toast.show { opacity:1; }

/* empty state */
.empty-state { text-align:center; padding:40px 20px; color:var(--ink-faint); }
.empty-state svg { width:48px; height:48px; margin-bottom:12px; opacity:.5; }
.empty-state p { font-size:14px; }

/* responsive */
@media(max-width:600px) {
  .stats-bar { grid-template-columns:repeat(2,1fr); padding:10px 16px; }
  .tabs { padding:0 16px; }
  .tab { padding:10px 10px; font-size:12px; }
  .content { padding:12px 16px; }
  .topbar { padding:12px 16px; }
}
</style>
</head>
<body>

<!-- Login Gate -->
<div id="gate">
  <div class="gate-box">
    <h2>管理后台</h2>
    <p>二游情报铺 · 仅限店主访问</p>
    <input type="password" id="gate-pwd" class="gate-input" placeholder="请输入管理密码" autocomplete="off">
    <button class="gate-btn" id="gate-login">进入</button>
    <div class="gate-err" id="gate-err">密码错误</div>
  </div>
</div>

<!-- Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="sidebar" id="sidebar">
  <button class="sidebar-close" id="sidebar-close">&times;</button>
  <h3>订单视图</h3>
  <div class="sidebar-item active" data-view="single" id="sb-single">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    单笔订单
  </div>
  <div class="sidebar-item" data-view="group" id="sb-group">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    拼团
  </div>
</div>

<!-- Top Bar -->
<div class="topbar">
  <button class="hamburger" id="btn-sidebar" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div style="flex:1">
    <h1 id="page-title">工作台</h1>
    <div class="sub" id="header-sub">加载中…</div>
  </div>
</div>

<!-- ===== WORKSPACE VIEW ===== -->
<div id="view-workspace">
  <div class="stats-bar" id="stats-bar">
    <div class="stat-card"><div class="num" id="st-unused">-</div><div class="label">可用兑换码</div></div>
    <div class="stat-card"><div class="num" id="st-char">-</div><div class="label">角色库码</div></div>
    <div class="stat-card"><div class="num" id="st-weapon">-</div><div class="label">武器库码</div></div>
    <div class="stat-card"><div class="num" id="st-used">-</div><div class="label">已用兑换码</div></div>
    <div class="stat-card"><div class="num" id="st-redeem">-</div><div class="label">兑换记录</div></div>
    <div class="stat-card"><div class="num" id="st-dev-free">-</div><div class="label">空闲设备码</div></div>
    <div class="stat-card"><div class="num" id="st-dev-claimed">-</div><div class="label">已分配设备码</div></div>
  </div>
  <div class="tabs" id="ws-tabs">
    <button class="tab active" data-panel="p-unused">可用兑换码</button>
    <button class="tab" data-panel="p-used">已用兑换码</button>
    <button class="tab" data-panel="p-records">兑换记录</button>
    <button class="tab" data-panel="p-devices">设备码</button>
    <button class="tab" data-panel="p-generate">生成新码</button>
  </div>
  <div class="content">
    <div class="panel active" id="p-unused">
      <div class="code-toolbar">
        <button class="btn-sm active" id="btn-filter-all" data-pool="">全部</button>
        <button class="btn-sm" id="btn-filter-char" data-pool="character">角色库</button>
        <button class="btn-sm" id="btn-filter-weapon" data-pool="weapon">武器库</button>
        <button class="btn-sm" id="btn-copy-all-unused">复制全部</button>
        <span style="font-size:12px;color:var(--ink-dim)" id="unused-count"></span>
      </div>
      <div class="code-grid" id="unused-grid"></div>
    </div>
    <div class="panel" id="p-used">
      <div class="table-wrap"><table><thead><tr><th>兑换码</th><th>使用时间</th><th>设备码</th><th>商品</th></tr></thead><tbody id="used-tbody"><tr><td colspan="4" class="loading"><div class="spinner"></div></td></tr></tbody></table></div>
    </div>
    <div class="panel" id="p-records">
      <div class="table-wrap"><table><thead><tr><th>#</th><th>时间</th><th>设备码</th><th>资料库</th><th>类型</th><th>兑换码</th></tr></thead><tbody id="records-tbody"><tr><td colspan="6" class="loading"><div class="spinner"></div></td></tr></tbody></table></div>
    </div>
    <div class="panel" id="p-devices">
      <div class="code-toolbar"><span style="font-size:12px;color:var(--ink-dim)" id="dev-summary"></span></div>
      <div class="table-wrap"><table><thead><tr><th>设备码</th><th>状态</th><th>指纹</th><th>分配时间</th></tr></thead><tbody id="dev-tbody"><tr><td colspan="4" class="loading"><div class="spinner"></div></td></tr></tbody></table></div>
    </div>
    <div class="panel" id="p-generate">
      <div class="gen-form">
        <h3 style="font-size:15px;margin-bottom:14px;color:var(--accent-deep)">生成新兑换码</h3>
        <label>类型</label>
        <select id="gen-pool" style="width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:var(--font);outline:none;margin-bottom:12px">
          <option value="character">角色库</option>
          <option value="weapon" selected>武器库</option>
        </select>
        <label>数量（1-500）</label><input type="number" id="gen-count" value="50" min="1" max="500">
        <button class="btn-sm success" id="btn-gen-codes" style="width:100%;padding:10px;font-size:14px;">生成兑换码</button>
        <div class="gen-result" id="gen-result"></div>
      </div>
      <div class="gen-form">
        <h3 style="font-size:15px;margin-bottom:14px;color:var(--accent-deep)">生成新设备码</h3>
        <label>数量（1-200）</label><input type="number" id="gen-dev-count" value="20" min="1" max="200">
        <button class="btn-sm success" id="btn-gen-dev" style="width:100%;padding:10px;font-size:14px;">生成设备码</button>
        <div class="gen-result" id="gen-dev-result"></div>
      </div>
      <div class="gen-form">
        <h3 style="font-size:15px;margin-bottom:14px;color:var(--accent-deep)">清理兑换码</h3>
        <p style="font-size:12px;color:var(--ink-dim);margin-bottom:12px">删除超过指定天数未使用的兑换码（不影响已分配的码）</p>
        <label>天数</label><input type="number" id="cleanup-days" value="30" min="1" max="365">
        <button class="btn-sm danger" id="btn-cleanup" style="width:100%;padding:10px;font-size:14px;">清理废码</button>
        <div class="gen-result" id="cleanup-result"></div>
      </div>
    </div>
  </div>
</div>

<!-- ===== ORDERS VIEW ===== -->
<div id="view-orders" style="display:none">
  <div class="content" id="orders-content"></div>
</div>

<!-- Bottom Nav -->
<nav id="bnav">
  <div class="bnav-inner">
    <button class="bnav-item active" data-tab="workspace">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span class="bnav-label">工作台</span>
    </button>
    <button class="bnav-item" data-tab="orders">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
      <span class="bnav-label">订单</span>
    </button>
  </div>
</nav>

<!-- Toast -->
<div class="toast" id="toast"></div>

  }).then(function(r) { return r.json(); });
}
function toast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(function() { t.classList.remove("show"); }, 2000); }
function copyText(text) { if (navigator.clipboard) { navigator.clipboard.writeText(text).then(function() { toast("已复制"); }); } else { var ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("已复制"); } catch(e) {} document.body.removeChild(ta); } }
function fmtTime(iso) { if (!iso) return "-"; var d = new Date(iso), p = function(n) { return n < 10 ? "0" + n : n; }; return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()); }

// ===== Load All =====
function loadAll() {
  loadStats(); loadUsed(); loadRecords(); loadDevices();
  // 先加载兑换码和订单，再渲染（确保下拉框有数据）
  Promise.all([loadUnused(), loadOrders(), loadGroups()]).then(function() { renderOrders(); });
  document.getElementById("header-sub").textContent = "已登录 · " + new Date().toLocaleString("zh-CN");
}

function loadStats() {
  rpc("admin_stats", { p_secret: SECRET }).then(function(r) {
    if (!r || !r.ok) return;
    document.getElementById("st-unused").textContent = r.unused_codes;
    document.getElementById("st-char").textContent = r.char_unused || 0;
    document.getElementById("st-weapon").textContent = r.weapon_unused || 0;
    document.getElementById("st-used").textContent = r.used_codes;
    document.getElementById("st-redeem").textContent = r.total_redemptions;
    document.getElementById("st-dev-free").textContent = r.free_devices;
    document.getElementById("st-dev-claimed").textContent = r.claimed_devices;
  });
}

var unusedByPool = { character: [], weapon: [] };
var currentPoolFilter = "";

function loadUnused() {
  return Promise.all([
    rpc("admin_unused_codes", { p_secret: SECRET }),
    rpc("admin_unused_codes", { p_secret: SECRET, p_pool: "character" }),
    rpc("admin_unused_codes", { p_secret: SECRET, p_pool: "weapon" })
  ]).then(function(results) {
    if (results[0] && results[0].ok) unusedCodes = results[0].codes || [];
    if (results[1] && results[1].ok) unusedByPool.character = results[1].codes || [];
    if (results[2] && results[2].ok) unusedByPool.weapon = results[2].codes || [];
    renderUnusedGrid();
  });
}

function renderUnusedGrid() {
  var codes = currentPoolFilter ? (unusedByPool[currentPoolFilter] || []) : unusedCodes;
  var poolLabel = currentPoolFilter === "character" ? "角色库" : (currentPoolFilter === "weapon" ? "武器库" : "全部");
  document.getElementById("unused-count").textContent = poolLabel + " " + codes.length + " 个可用";
  var grid = document.getElementById("unused-grid");
  if (!codes.length) { grid.innerHTML = '<div style="color:var(--ink-faint);padding:16px">暂无可用兑换码</div>'; return; }
  grid.innerHTML = codes.map(function(c) { return '<div class="code-chip" data-code="' + c + '">' + c + '</div>'; }).join("");
  grid.querySelectorAll(".code-chip").forEach(function(ch) { ch.addEventListener("click", function() { copyText(ch.getAttribute("data-code")); }); });
}

// Pool filter buttons
document.querySelectorAll("#p-unused .code-toolbar .btn-sm[data-pool]").forEach(function(btn) {
  btn.addEventListener("click", function() {
    currentPoolFilter = btn.getAttribute("data-pool");
    document.querySelectorAll("#p-unused .code-toolbar .btn-sm[data-pool]").forEach(function(b) { b.classList.toggle("active", b === btn); });
    renderUnusedGrid();
  });
});

document.getElementById("btn-copy-all-unused").addEventListener("click", function() {
  rpc("admin_unused_codes", { p_secret: SECRET }).then(function(r) { if (r && r.ok) copyText((r.codes || []).join("\n")); });
});

function loadUsed() {
  rpc("admin_used_codes", { p_secret: SECRET }).then(function(r) {
    var tb = document.getElementById("used-tbody");
    if (!r || !r.ok) { tb.innerHTML = '<tr><td colspan="4" style="color:var(--danger)">加载失败</td></tr>'; return; }
    var codes = r.codes || [];
    if (!codes.length) { tb.innerHTML = '<tr><td colspan="4" style="color:var(--ink-faint);text-align:center;padding:20px">暂无</td></tr>'; return; }
    tb.innerHTML = codes.map(function(c) { return '<tr><td class="mono">' + c.code + '</td><td class="dim">' + fmtTime(c.used_at) + '</td><td class="mono">' + (c.device || '-') + '</td><td>' + (c.product || '-') + '</td></tr>'; }).join("");
  });
}

function loadRecords() {
  rpc("admin_redemptions", { p_secret: SECRET }).then(function(r) {
    var tb = document.getElementById("records-tbody");
    if (!r || !r.ok) { tb.innerHTML = '<tr><td colspan="6" style="color:var(--danger)">加载失败: ' + (r && r.error || '未知错误') + '</td></tr>'; return; }
    var recs = r.redemptions || [];
    if (!recs.length) { tb.innerHTML = '<tr><td colspan="6" style="color:var(--ink-faint);text-align:center;padding:20px">暂无</td></tr>'; return; }
    tb.innerHTML = recs.map(function(r) {
      var poolLabel = r.pool === 'character' ? '角色' : (r.pool === 'weapon' ? '武器' : '-');
      var gidLabel = r.gid || '-';
      return '<tr><td>' + r.id + '</td><td class="dim">' + fmtTime(r.redeemed_at) + '</td><td class="mono">' + r.device_code + '</td><td>' + gidLabel + '</td><td>' + poolLabel + '</td><td class="mono">' + r.redemption_code + '</td></tr>';
    }).join("");
  });
}

function loadDevices() {
  rpc("admin_device_codes", { p_secret: SECRET }).then(function(r) {
    var tb = document.getElementById("dev-tbody");
    if (!r || !r.ok) { tb.innerHTML = '<tr><td colspan="4" style="color:var(--danger)">加载失败</td></tr>'; return; }
    var codes = r.codes || [];
    document.getElementById("dev-summary").textContent = "已分配 " + r.claimed + " / 空闲 " + r.free + " / 共 " + codes.length;
    if (!codes.length) { tb.innerHTML = '<tr><td colspan="4" style="color:var(--ink-faint);text-align:center;padding:20px">暂无</td></tr>'; return; }
    tb.innerHTML = codes.map(function(d) {
      var st = d.claimed ? '<span style="color:var(--success);font-weight:700">已分配</span>' : '<span style="color:var(--ink-faint)">空闲</span>';
      return '<tr><td class="mono">' + d.code + '</td><td>' + st + '</td><td class="dim">' + (d.fingerprint || '-') + '</td><td class="dim">' + fmtTime(d.assigned_at) + '</td></tr>';
    }).join("");
  });
}

// ===== ORDERS =====
function loadOrders() { return rpc("admin_orders", { p_secret: SECRET }).then(function(r) { if (r && r.ok) allOrders = r.orders || []; }); }
function loadGroups() { return rpc("admin_groups", { p_secret: SECRET }).then(function(r) { if (r && r.ok) allGroups = r.groups || []; }); }

function renderOrders() {
  var el = document.getElementById("orders-content");
  if (orderView === "single") {
    var pending = allOrders.filter(function(o) { return o.status === "pending"; });
    var completed = allOrders.filter(function(o) { return o.status === "completed"; });
    el.innerHTML = '<div style="margin-bottom:12px;font-size:14px;font-weight:700;color:var(--accent-deep)">待处理 (' + pending.length + ')</div>' +
      (pending.length ? pending.map(renderOrderCard).join("") : '<div class="empty-state"><p>暂无待处理订单</p></div>') +
      '<div style="margin:20px 0 12px;font-size:14px;font-weight:700;color:var(--ink-dim)">已完成 (' + completed.length + ')</div>' +
      (completed.length ? completed.map(renderOrderCard).join("") : '<div class="empty-state"><p>暂无已完成订单</p></div>');
    bindOrderEvents();
  } else {
    renderGroupView(el);
  }
}

function renderOrderCard(o) {
  var items = (o.items || []).map(function(it) {
    var priceStr = it.line_total === 0 ? '<span style="color:var(--success);font-style:italic">赠品</span>' : it.line_total + '元';
    return '<tr><td class="oi-name">' + it.product_name + '</td><td class="oi-price">' + priceStr + '</td></tr>';
  }).join("");
  var codes = (o.codes || []).map(function(c) { return '<div style="font-size:12px;font-family:Consolas,monospace;margin-top:4px">' + c.product_code + ': <b>' + c.redemption_code + '</b></div>'; }).join("");
  var groupOpts = allGroups.map(function(g) { return '<option value="' + g.id + '"' + (o.group_id === g.id ? ' selected' : '') + '>' + (g.name || '拼团 #' + g.id) + '</option>'; }).join("");
  var pmOpts = [['cash','现金'],['crypto','电子货币']].map(function(p) { return '<option value="' + p[0] + '"' + (o.payment_method === p[0] ? ' selected' : '') + '>' + p[1] + '</option>'; }).join("");

  return '<div class="order-card" data-order-id="' + o.id + '">' +
    '<div class="order-head">' +
      '<div><span class="order-id">#' + o.id + '</span> <span class="order-device">' + o.device_code + '</span></div>' +
      '<div style="display:flex;align-items:center;gap:8px"><span class="order-status ' + o.status + '">' + (o.status === "pending" ? "待处理" : "已完成") + '</span><span class="order-total">' + (o.total || o.total_price || 0) + '元</span></div>' +
    '</div>' +
    '<div class="order-meta">' +
      '<span>' + fmtTime(o.created_at) + '</span>' +
      (o.is_group_buy ? '<span style="color:var(--accent);font-weight:600">拼团</span>' : '') +
      (o.payment_method ? '<span>' + (o.payment_method === "cash" ? "现金" : "电子货币") + '</span>' : '') +
      (o.notes ? '<span>' + o.notes + '</span>' : '') +
    '</div>' +
    '<div class="order-body">' +
      '<table class="order-items-table">' + items + '</table>' +
      (codes ? '<div style="margin-top:8px;padding:10px;background:var(--accent-pale);border-radius:8px"><div style="font-size:12px;font-weight:700;margin-bottom:4px">已分配兑换码</div>' + codes + '</div>' : '') +
      (o.status === "pending" ? '<div style="margin-top:14px">' +
        '<div class="order-edit-row"><label>支付方式</label><select class="pm-select" data-order="' + o.id + '">' + pmOpts + '</select></div>' +
        '<div class="order-edit-row"><label>拼团</label><select class="group-select" data-order="' + o.id + '"><option value="">不拼团</option>' + groupOpts + '</select></div>' +
        '<div class="order-edit-row"><label>备注</label><input type="text" class="notes-input" data-order="' + o.id + '" value="' + (o.notes || "").replace(/"/g, '&quot;') + '" placeholder="可选"></div>' +
        '<div class="order-actions">' +
          '<button class="btn-sm success btn-complete" data-order="' + o.id + '">确认完成（自动分配兑换码）</button>' +
        '</div>' +
      '</div>' : '') +
    '</div>' +
  '</div>';
}

function renderGroupView(el) {
  // 自动检查过期拼团
  rpc("admin_check_expired_groups", { p_secret: SECRET });

  var pending = allGroups.filter(function(g) { return g.status === 'pending'; });
  var ended = allGroups.filter(function(g) { return g.status !== 'pending'; });

  var groupsHtml = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">' +
    '<span style="font-size:14px;font-weight:700;color:var(--accent-deep)">拼团组 (' + allGroups.length + ')</span>' +
    '<button class="btn-sm success" id="btn-create-group">新建拼团组</button></div>';

  if (!allGroups.length) {
    groupsHtml += '<div class="empty-state"><p>暂无拼团组，点击上方按钮创建</p></div>';
  } else {
    // 进行中的拼团
    if (pending.length) {
      groupsHtml += '<div style="font-size:13px;font-weight:700;color:var(--accent-deep);margin-bottom:8px">进行中 (' + pending.length + ')</div>';
      pending.forEach(function(g) { groupsHtml += renderGroupCard(g); });
    }
    // 已结束的拼团
    if (ended.length) {
      groupsHtml += '<div style="font-size:13px;font-weight:700;color:var(--ink-dim);margin:16px 0 8px">已结束 (' + ended.length + ')</div>';
      ended.forEach(function(g) { groupsHtml += renderGroupCard(g); });
    }
  }
  el.innerHTML = groupsHtml;
  bindGroupEvents();
}

function renderGroupCard(g) {
  var gOrders = allOrders.filter(function(o) { return o.group_id === g.id; });
  var orderList = gOrders.map(function(o) {
    var itemCount = (o.items || []).filter(function(it) { return it.line_total > 0; }).length;
    return '<div class="group-order-mini" style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)">' +
      '<div><span style="font-weight:700">#' + o.id + '</span> <span class="order-device" style="font-size:11px">' + o.device_code + '</span> <span style="font-size:11px;color:var(--ink-dim)">' + itemCount + '件</span></div>' +
      '<div style="display:flex;align-items:center;gap:6px"><span>' + (o.total || o.total_price || 0) + '元</span>' +
      '<span class="order-status ' + o.status + '" style="font-size:10px">' + (o.status === "pending" ? "待处理" : "已完成") + '</span>' +
      (g.status === 'pending' ? '<button class="btn-sm danger group-kick-order" data-group="' + g.id + '" data-order="' + o.id + '" style="padding:3px 8px;font-size:11px">踢出</button>' : '') +
      '</div></div>';
  }).join("");

  var statusBadge = '';
  if (g.status === 'ended') statusBadge = g.result === 'success' ? '<span style="color:var(--success);font-weight:700;font-size:12px"> · 成功</span>' : '<span style="color:var(--danger);font-weight:700;font-size:12px"> · 未成功</span>';
  if (g.status === 'expired') statusBadge = '<span style="color:var(--ink-faint);font-weight:700;font-size:12px"> · 超时结束</span>';

  var expStr = '';
  if (g.status === 'pending' && g.expires_at) {
    var daysLeft = Math.max(0, Math.ceil((new Date(g.expires_at) - Date.now()) / 86400000));
    expStr = ' · 剩余' + daysLeft + '天';
  }

  var html = '<div class="group-card" data-group-id="' + g.id + '">' +
    '<div class="group-head"><div><span class="group-name">' + (g.name || '拼团 #' + g.id) + statusBadge + '</span>' +
    '<div class="group-stats">' + g.device_count + '/5 设备 · ' + (g.item_count || 0) + ' 商品 · 合计 ' + g.total_price + '元' +
    (g.is_public ? ' · <span style="color:var(--success)">公开中</span>' : '') + expStr + '</div></div>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap">';

  if (g.status === 'pending') {
    html += '<button class="btn-sm group-rename" data-group="' + g.id + '">改名</button>' +
      '<button class="btn-sm ' + (g.is_public ? 'warning' : 'success') + ' group-toggle-public" data-group="' + g.id + '" data-public="' + g.is_public + '">' + (g.is_public ? '取消公开' : '公开') + '</button>' +
      '<button class="btn-sm warning group-end" data-group="' + g.id + '">结束拼团</button>' +
      '<button class="btn-sm danger group-delete" data-group="' + g.id + '">删除</button>';
  }
  html += '</div></div>' +
    '<div class="group-orders">' + (orderList || '<div style="color:var(--ink-faint);font-size:12px;padding:8px 0">暂无订单</div>') + '</div></div>';
  return html;
}

function bindOrderEvents() {
  // expand/collapse
  document.querySelectorAll(".order-card").forEach(function(card) {
    card.querySelector(".order-head").addEventListener("click", function() { card.classList.toggle("expanded"); });
  });
  // complete - 先保存支付方式和拼团状态，再自动分配兑换码并确认
  document.querySelectorAll(".btn-complete").forEach(function(btn) {
    btn.addEventListener("click", function(e) {
      e.stopPropagation();
      var oid = parseInt(btn.getAttribute("data-order"));
      var card = btn.closest(".order-card");
      var pm = card.querySelector(".pm-select").value;
      var gid = card.querySelector(".group-select").value;
      var notes = card.querySelector(".notes-input").value;
      btn.disabled = true; btn.textContent = "处理中…";
      // 先保存编辑信息
      var editPromise = rpc("admin_edit_order", { p_secret: SECRET, p_order_id: oid, p_notes: notes, p_payment_method: pm, p_is_group_buy: !!gid });
      var groupPromise;
      if (gid) {
        groupPromise = rpc("admin_add_to_group", { p_secret: SECRET, p_order_id: oid, p_group_id: parseInt(gid) });
      } else {
        groupPromise = rpc("admin_remove_from_group", { p_secret: SECRET, p_order_id: oid });
      }
      Promise.all([editPromise, groupPromise]).then(function() {
        // 再自动分配兑换码并确认完成
        return rpc("admin_auto_assign_and_complete", { p_secret: SECRET, p_order_id: oid });
      }).then(function(r) {
        btn.disabled = false; btn.textContent = "确认完成（自动分配兑换码）";
        if (r && r.ok) {
          toast("订单已完成，兑换码已自动分配");
          Promise.all([loadUnused(), loadOrders(), loadGroups()]).then(function() { renderOrders(); });
          loadStats();
        } else {
          var err = (r && r.error) || "";
          if (err === "no_available_codes") toast("没有足够的可用兑换码（" + (r && r.pool || "") + "），请先生成");
          else if (err === "unauthorized") toast("密码已过期，请刷新页面重新登录");
          else if (err === "already_completed") toast("订单已完成");
          else toast("确认失败: " + (err || JSON.stringify(r)));
        }
      }).catch(function(err) {
        btn.disabled = false; btn.textContent = "确认完成（自动分配兑换码）";
        toast("网络错误，请重试"); console.error(err);
      });
    });
  });
}

function bindGroupEvents() {
  // create group
  var createBtn = document.getElementById("btn-create-group");
  if (createBtn) createBtn.addEventListener("click", function() {
    var name = prompt("拼团组名称（可选）");
    rpc("admin_create_group", { p_secret: SECRET, p_name: name || "" }).then(function(r) {
      if (r && r.ok) { toast("拼团组已创建（3天后自动结束）"); loadGroups().then(renderOrders); }
    });
  });
  // rename
  document.querySelectorAll(".group-rename").forEach(function(btn) {
    btn.addEventListener("click", function() {
      var name = prompt("新名称");
      if (!name) return;
      rpc("admin_rename_group", { p_secret: SECRET, p_group_id: parseInt(btn.getAttribute("data-group")), p_name: name }).then(function(r) {
        if (r && r.ok) { loadGroups().then(renderOrders); }
      });
    });
  });
  // toggle public
  document.querySelectorAll(".group-toggle-public").forEach(function(btn) {
    btn.addEventListener("click", function() {
      var isPublic = btn.getAttribute("data-public") === "true";
      rpc("admin_set_group_public", { p_secret: SECRET, p_group_id: parseInt(btn.getAttribute("data-group")), p_public: !isPublic }).then(function(r) {
        if (r && r.ok) { loadGroups().then(renderOrders); }
      });
    });
  });
  // end group
  document.querySelectorAll(".group-end").forEach(function(btn) {
    btn.addEventListener("click", function() {
      if (!confirm("确认结束此拼团？将通知所有参与者拼团结果。此操作不可撤回。")) return;
      rpc("admin_end_group", { p_secret: SECRET, p_group_id: parseInt(btn.getAttribute("data-group")) }).then(function(r) {
        if (r && r.ok) {
          toast("拼团已结束：" + (r.result === "success" ? "成功" : "未成功") + "（" + r.item_count + "商品 / " + r.device_count + "人）");
          loadGroups().then(renderOrders);
        } else {
          toast("结束失败: " + (r && r.error || "未知错误"));
        }
      });
    });
  });
  // kick order from group
  document.querySelectorAll(".group-kick-order").forEach(function(btn) {
    btn.addEventListener("click", function() {
      var oid = btn.getAttribute("data-order");
      if (!confirm("确认将订单 #" + oid + " 从拼团中踢出？将即时通知该用户。")) return;
      rpc("admin_remove_from_group", { p_secret: SECRET, p_order_id: parseInt(oid) }).then(function(r) {
        if (r && r.ok) {
          toast("订单 #" + oid + " 已从拼团中移除，已通知用户");
          Promise.all([loadGroups(), loadOrders()]).then(renderOrders);
        } else {
          toast("踢出失败: " + (r && r.error || "未知错误"));
        }
      });
    });
  });
  // delete
  document.querySelectorAll(".group-delete").forEach(function(btn) {
    btn.addEventListener("click", function() {
      if (!confirm("删除此拼团组？组内订单将变为非拼团状态。")) return;
      rpc("admin_delete_group", { p_secret: SECRET, p_group_id: parseInt(btn.getAttribute("data-group")) }).then(function(r) {
        if (r && r.ok) { toast("已删除"); loadGroups().then(loadOrders()).then(renderOrders); }
      });
    });
  });
}
</script>
</body>
</html>
